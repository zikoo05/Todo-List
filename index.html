
<!DOCTYPE html>
<html>
<head>
    <title>Todo List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;            
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #764ba2;
        }
        ul {
            list-style: none;
        }
        li {
            background: #f5f5f5;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #667eea;
        }
        li.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }
        .delete-btn {
            background: #ff6b6b;
            padding: 5px 10px;
            font-size: 12px;
        }
        .delete-btn:hover {
            background: #ff5252;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Todo List</h1>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button onclick="addTask()">Add</button>
        </div>
        <ul id="tasklist"></ul>
    </div>

    <script>
        function addTask() {
            const input = document.getElementById("taskInput");
            const task = input.value.trim();

            if (task==="") {
                alert("Please enter a task!");
                return;
            }

            const li = document.createElement("li")
            li.innerHTML = `
                <span onclick="this.parentElement.classlist.toggle('completed')">${task}</span>
                <button class="delete-btn" onclick="this.parentElement.remove()">Delete</button>
            `;

            document.getElementById("taskList").appendChild(li);
            input.value = "";
            input.focus();
        }

        document.getElementById("taskInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") addTask();
        });
    </script>
</body>
</html>
